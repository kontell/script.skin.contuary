[tox]
envlist = black, compileall

[testenv]
skip_install = true
deps = -r requirements-dev.txt

[testenv:black]
commands = black --check --diff .

# No test suite and no mypy: the addon is one 184-line file whose every
# statement calls into Kodi, so a syntax gate plus black is the honest ceiling
# for what can be checked outside a running Kodi. Live behaviour is verified by
# running the selector from Contuary's skin settings.
[testenv:compileall]
commands = python -m compileall -q default.py tools/
