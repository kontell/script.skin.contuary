[tox]
envlist = black, compileall, py

[testenv]
skip_install = true
deps = -r requirements-dev.txt

[testenv:black]
commands = black --check --diff .

# Kodistubs are import shims only (Omega 21 stubs). Tests fake
# xbmc.executeJSONRPC / xbmcvfs.translatePath; do not call unstubbed Piers APIs.
[testenv:compileall]
commands = python -m compileall -q default.py lib/ tools/

[testenv:py]
commands = pytest tests/unit -q
